# hypridle — idle management for Hyprland.
# Launched from hypr/modules/system/autostart.lua (execs `hypridle` on start).
# Relaxed profile: lock @10m, screen off @12m, suspend @30m.

general {
    lock_cmd = qs ipc call lock lock          # avoid stacking multiple locks
    before_sleep_cmd = qs ipc call lock lock   # lock before the system suspends
    after_sleep_cmd = hyprctl dispatch dpms on # ensure the display wakes on resume
}

# Lock after 10 minutes idle.
listener {
    timeout = 600
    on-timeout = qs ipc call lock lock
}

# Turn the display off shortly after locking; back on with any activity.
listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 30 minutes idle.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
