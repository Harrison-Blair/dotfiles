general {
    lock_cmd         = qs ipc call lock lock   # reuse the Quickshell lock
    before_sleep_cmd = qs ipc call lock lock   # lock before the system suspends
    after_sleep_cmd  = hyprctl dispatch dpms on
}

listener {
    timeout    = 300                           # 5 min -> lock
    on-timeout = qs ipc call lock lock
}

listener {
    timeout    = 360                           # 6 min -> screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

listener {
    timeout    = 900                           # 15 min -> suspend
    on-timeout = systemctl suspend
}
