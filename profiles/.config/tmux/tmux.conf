# Claude Code agent-team layout: keep the leader pane at 50% (Claude hardcodes 30%).
# Safety net for when a Claude Code update reverts the binary patch before the
# next launch re-applies it (see ~/.local/bin/cc-patch-panes.sh).
#
# Claude's last layout command is `resize-pane -x 30%`, so we react after a
# resize. Guard: only windows with 3+ panes; the helper no-ops once the leftmost
# pane is ~half width, so it corrects once and stops (no loop).
#
# The `-d 0.2` deferral is required: a resize-pane issued synchronously inside an
# after-resize-pane hook is clobbered by the resize that is still completing.
# Delaying the helper ~0.2s runs it after that settles, so the correction sticks.
# #{window_id} is expanded by run-shell and passed to the helper so it targets the
# triggering window explicitly (never an ambiguous "current" session). Absolute
# path: tmux does not reliably expand ~ in a delayed run-shell. Brace grouping
# avoids three-deep quote nesting.
set-hook -g after-resize-pane {
  if-shell -F "#{>=:#{window_panes},3}" {
    run-shell -b -d 0.2 "/home/penguin/.config/tmux/cc-leader-5050.sh #{window_id}"
  }
}
