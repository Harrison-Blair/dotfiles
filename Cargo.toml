[package]
name = "tui"
version = "0.1.0"
edition = "2021"
description = "dotfiles TUI — sync config folders between ~ and versioned profiles/"

[[bin]]
name = "tui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
whoami = "1.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
