name: Build Tui Helper

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - '.github/workflows/build-tui.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build tui binary (static musl)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Move binary to repo root
        run: |
          mv target/x86_64-unknown-linux-musl/release/tui tui
          chmod +x tui

      - name: Commit binary to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tui
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Build tui binary [skip ci]"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, attempt $i — rebasing on origin/main and retrying"
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push after 5 attempts"
          exit 1
