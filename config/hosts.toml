# Per-machine override paths, keyed by home-relative folder path.
# Listed paths (relative to the key; files or dirs) are NOT stored in the
# shared profiles/<key>; each machine keeps its own copy under
# profiles/hosts/<hostname>/<key>/<path>. Read at runtime, no rebuild needed.
[overrides]
".config/hypr" = [
  "modules/display/monitors.lua",
  "modules/display/workspaces.lua",
  "modules/system/autostart.lua",
  "modules/system/env.lua",
]
