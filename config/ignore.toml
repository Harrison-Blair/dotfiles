  ".rustup",
  ".ssh",
  ".steam",
  ".supabase",
  ".vim",
  ".vscode-oss-shared",
  "1Password",
  "VSCodium",
  "BraveSoftware",
  "chromium",
  "dconf",
  "discord",
  "docker-secrets-engine",
  "google-chrome",
  "google-chrome-beta",
  "google-chrome-unstable",
  "matplotlib",
  "microsoft-edge-dev",
  "mozilla",
  "nextjs-nodejs",
  "obs-studio",
  "spotify",
  "unity3d",
